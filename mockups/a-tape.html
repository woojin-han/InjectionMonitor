<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>택체크 A안 · 가격 줄자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Archivo+Narrow:wght@500;700&display=swap">
<style>
/* 콘셉트: 재단사의 줄자. 모든 가격을 같은 눈금 위에 올려 "얼마나 내려갔는지"를 길이로 잰다.
   레이아웃: 카드 대신 줄자 한 줄 = 상품 한 개인 목록. 줄자의 노란색만 강하게, 나머지는 조용하게. */
:root{
  --paper:#ffffff; --ground:#eef1f5; --ink:#1d2433; --ink-2:#5a6475; --rule:#dfe3ea;
  --tape:#f4c430; --tape-edge:#d9a90f; --tape-ink:#3b2f00;
  --real:#13795b; --inflated:#c2255c; --normal:#5a6475; --insuf:#98a1b0; --low:#5b3cc4; --down:#1864ab;
  --c-line:#1d2433; --c-list:#c2255c; --c-low:#5b3cc4; --c-grid:#eef1f5; --c-text:#98a1b0; --c-bg:#fff;
  --num:'Archivo Narrow','IBM Plex Sans KR',sans-serif; --body:'IBM Plex Sans KR',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mock{background:var(--ink);color:#fff;font-size:12px;padding:6px 16px;display:flex;gap:14px;overflow-x:auto;white-space:nowrap}.mock a{opacity:.72}.mock a:hover{opacity:1}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--paper);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:10}
.hd{display:flex;align-items:center;gap:18px;height:62px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.logo svg{flex:none}
.search{flex:1;max-width:440px;border:1px solid var(--rule);border-radius:8px;padding:9px 12px;color:var(--ink-2);font-size:13px}
.tools{margin-left:auto;display:flex;gap:6px;align-items:center;position:relative}
.ib{background:none;border:1px solid transparent;border-radius:8px;width:40px;height:40px;position:relative;font-size:17px}.ib:hover{border-color:var(--rule)}
.dot{position:absolute;top:4px;right:4px;min-width:16px;height:16px;border-radius:8px;background:var(--inflated);color:#fff;font-size:10px;line-height:16px;font-weight:700}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:8px;padding:9px 14px;font-weight:700;font-size:13px}.btn.line{background:var(--paper);color:var(--ink)}
.btn.tape{background:var(--tape);border-color:var(--tape-edge);color:var(--tape-ink)}

/* 홈 */
.intro{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:end;padding:30px 0 22px}
.intro h1{font-size:28px;line-height:1.3;margin:0;text-wrap:balance;font-weight:700}
.intro p{margin:8px 0 0;color:var(--ink-2);max-width:56ch}
.legend{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;font-size:12px;color:var(--ink-2)}
.legend b{color:var(--ink)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 0 14px}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--rule);border-radius:9px;padding:3px}
.seg button{background:none;border:0;padding:6px 12px;border-radius:7px;font-size:13px;color:var(--ink-2)}.seg .on{background:var(--ink);color:#fff}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--ink-2);background:var(--paper);border:1px solid var(--rule);border-radius:9px;padding:6px 10px}
.sort{margin-left:auto;font-size:13px;color:var(--ink-2)}
.list{background:var(--paper);border:1px solid var(--rule);border-radius:12px;margin-bottom:48px}
.row{display:grid;grid-template-columns:64px minmax(0,1.1fr) minmax(0,2fr) 128px 36px;gap:16px;align-items:center;padding:14px 18px;border-top:1px solid var(--rule);cursor:pointer}
.row:first-child{border-top:0}.row:hover{background:#fafbfc}
.thumb{width:64px;height:64px;border-radius:8px;display:grid;place-items:center;font-size:32px}
.who{min-width:0}.who .b{font-weight:700;font-size:13px}.who .n{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .meta{font-size:12px;color:var(--insuf);margin-top:2px}
.price{text-align:right;font-family:var(--num)}.price .cur{font-size:20px;font-weight:700}.price .was{font-size:12px;color:var(--insuf);text-decoration:line-through}
.heart{background:none;border:0;font-size:18px;color:var(--insuf)}.heart.on{color:var(--inflated)}
.verdict{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;margin-top:4px}
.verdict i{width:8px;height:8px;border-radius:2px;display:inline-block}
.v-real{color:var(--real)}.v-real i{background:var(--real)}.v-inflated{color:var(--inflated)}.v-inflated i{background:var(--inflated)}
.v-normal{color:var(--normal)}.v-normal i{background:var(--normal)}.v-insufficient{color:var(--insuf)}.v-insufficient i{background:var(--insuf)}

/* 줄자 */
.tape{position:relative;height:46px}
.tape .band{position:absolute;left:0;right:0;top:12px;height:20px;background:var(--tape);border:1px solid var(--tape-edge);border-radius:3px;overflow:hidden}
.tape .ticks{position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,var(--tape-ink) 0 1px,transparent 1px 100%);background-size:var(--tick) 6px;background-repeat:repeat-x;opacity:.55}
.tape .ticks.major{background-size:calc(var(--tick)*5) 11px;opacity:.8}
.tape .fake{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(194,37,92,.28) 0 4px,transparent 4px 8px)}
.tape .realseg{position:absolute;top:0;bottom:0;background:rgba(19,121,91,.42)}
.mk{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-family:var(--num);font-size:11px;white-space:nowrap}
.mk .pin{width:2px;height:44px;background:var(--ink)}
.mk.cur .pin{width:3px;background:var(--ink)}
.mk.list .pin{background:var(--inflated);opacity:.7}
.mk.base .pin{background:var(--ink-2);height:38px;margin-top:6px}
.mk.low .pin{background:var(--low)}
.mk span{position:absolute;top:-15px;color:var(--ink-2)}
.mk.cur span{color:var(--ink);font-weight:700}.mk.list span{color:var(--inflated);right:-2px}.mk.low span{color:var(--low);top:auto;bottom:-15px}
.mk.base span{top:auto;bottom:-15px}

/* 상세 */
.back{display:inline-block;margin:18px 0 10px;font-size:13px;color:var(--ink-2)}
.dtop{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:22px;display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px}
.dthumb{aspect-ratio:1;max-width:100%;border-radius:10px;display:grid;place-items:center;font-size:96px}
.dtop h1{margin:2px 0 6px;font-size:22px;line-height:1.35}
.dtop .sub{color:var(--ink-2);font-size:13px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--rule);border-radius:10px;margin-top:16px}
.three div{padding:12px 14px}.three div+div{border-left:1px solid var(--rule)}
.three small{display:block;font-size:12px;color:var(--ink-2)}.three b{font-family:var(--num);font-size:24px}
.bigtape{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:30px 26px 34px;margin-top:14px}
.bigtape h2,.panel h2{font-size:15px;margin:0 0 28px}
.bigtape .tape{height:64px}.bigtape .tape .band{height:28px;top:16px}.bigtape .mk .pin{height:60px}.bigtape .mk.base .pin{height:52px;margin-top:8px}.bigtape .mk{font-size:12px}
.explain{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:30px;font-size:13px;color:var(--ink-2)}
.explain b{display:block;font-family:var(--num);font-size:20px;color:var(--ink)}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;margin:14px 0 48px}
.panel{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:20px}
.panel h2{margin-bottom:10px}
.chart{width:100%;height:auto;display:block}
.ai{border-left:3px solid var(--tape);padding:2px 0 2px 12px;margin:0 0 16px;line-height:1.6}
.ai small{display:block;color:var(--ink-2);font-size:12px;margin-bottom:2px}
.field{width:100%;border:1px solid var(--rule);border-radius:8px;padding:11px 12px;font-family:var(--num);font-size:20px;font-weight:700;margin:6px 0 10px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.quick button{background:var(--ground);border:0;border-radius:6px;padding:5px 10px;font-size:12px}
.panel label{display:flex;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.cmp{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}.cmp td{padding:9px 0;border-top:1px solid var(--rule)}.cmp td:last-child{text-align:right;font-family:var(--num);font-size:16px;font-weight:700}

/* 드롭다운, 로그인, 마이 */
.drop{position:absolute;right:0;top:48px;width:340px;background:var(--paper);border:1px solid var(--rule);border-radius:12px;box-shadow:0 12px 30px rgba(29,36,51,.14);display:none;overflow:hidden}.drop.on{display:block}
.drop h3{margin:0;padding:12px 14px;font-size:14px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between}.drop h3 a{font-weight:400;font-size:12px;color:var(--ink-2)}
.ni{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:12px 14px;border-bottom:1px solid var(--rule);font-size:13px}.ni.new{background:#fff8dc}.ni small{display:block;color:var(--ink-2);font-size:12px;margin-top:2px}
.auth{max-width:380px;margin:56px auto;background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:26px}
.auth h1{margin:0 0 4px;font-size:22px}.auth p{margin:0 0 14px;color:var(--ink-2);font-size:13px}
.auth input{width:100%;border:1px solid var(--rule);border-radius:8px;padding:12px;font:inherit;margin-top:8px}
.auth .btn{width:100%;margin-top:12px;padding:12px}.err{color:var(--inflated);font-size:12px;margin-top:4px}
.me h1{font-size:22px;margin:22px 0 14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin-bottom:14px}.tabs a{padding:10px 12px;color:var(--ink-2);border-bottom:2px solid transparent;font-weight:500}.tabs a.on{color:var(--ink);border-color:var(--tape-edge)}
footer{color:var(--ink-2);font-size:12px;padding:0 0 40px}
@media (max-width:900px){.row{grid-template-columns:56px minmax(0,1fr) auto 30px;grid-template-areas:'t w p h' 'g g g g'}.row>.thumb{grid-area:t}.row>.who{grid-area:w}.row>.price{grid-area:p}.row>.heart{grid-area:h}.row .tape{grid-area:g;margin:18px 0 10px}.price .cur{font-size:17px;white-space:nowrap}.thumb{width:56px;height:56px}.intro{grid-template-columns:1fr}.cols{grid-template-columns:1fr}}
@media (max-width:640px){.search{display:none}.row{padding:14px;gap:10px}.dtop{grid-template-columns:1fr}.dthumb{max-width:180px;font-size:80px}.three b{font-size:18px}.explain{grid-template-columns:1fr}.drop{position:fixed;left:8px;right:8px;width:auto;top:100px}.sort{margin-left:0}.bigtape{padding:30px 16px 34px}}
@media (prefers-reduced-motion:no-preference){.mk.cur{animation:slide .6s ease-out}@keyframes slide{from{left:var(--from)}}}
@media (max-width:640px){.hd{gap:10px}.logo{white-space:nowrap;font-size:22px}.logo b{font-size:15px}.tools{gap:4px}.tools .btn{white-space:nowrap;padding:8px 11px}}
</style>
</head>
<body>
<nav class="mock"><a href="index.html">목업 목록</a><span>A안 가격 줄자</span><a href="#/">홈</a><a href="#/p/1">상세: 부풀림 의심</a><a href="#/p/2">상세: 진짜 할인</a><a href="#/login">로그인</a><a href="#/me">마이</a></nav>
<header><div class="wrap hd">
  <a class="logo" href="#/"><svg width="30" height="18" viewBox="0 0 30 18" aria-hidden="true"><rect x="0.5" y="2.5" width="29" height="13" rx="2" fill="#f4c430" stroke="#d9a90f"/><path d="M5 3v5M10 3v8M15 3v5M20 3v8M25 3v5" stroke="#3b2f00" stroke-width="1.2"/></svg>택체크</a>
  <div class="search">상품명, 브랜드, 품번으로 찾기</div>
  <div class="tools">
    <button class="ib" id="bell" aria-label="알림 2개">🔔<span class="dot">2</span></button>
    <div class="drop" id="drop"></div>
    <a class="ib" href="#/me" aria-label="찜 목록" style="display:grid;place-items:center">♡</a>
    <a class="btn line" href="#/login">로그인</a>
  </div>
</div></header>
<main id="app" class="wrap"></main>
<footer class="wrap">비상업 학습 프로젝트입니다. 가격은 2026년 11월 14일부터 하루 두 번 직접 수집한 기록입니다.</footer>
<script src="shared.js"></script>
<script>
const {products,GRADE,NOTIS,won,pct,chart,CAT}=SC;const app=document.getElementById('app');const wished=new Set([2,8]);
const n=v=>Math.round(v).toLocaleString('ko-KR');
const P=id=>products.find(p=>p.id==id);
const verdict=s=>`<span class="verdict v-${s.grade}"><i></i>${GRADE[s.grade].label}</span>`;
// 줄자 하나 그리기. 눈금 범위는 상품마다 [최저가의 85% ~ 정가의 103%]
function tape(p,big){const s=p.s,lo=Math.min(s.atl,s.cur)*0.85,hi=p.list*1.03,x=v=>((v-lo)/(hi-lo)*100).toFixed(2)+'%';
  const step=hi-lo>150000?10000:hi-lo>60000?5000:2000, tick=`calc(100% * ${step}/${(hi-lo).toFixed(0)})`;
  const fake=s.base<p.list?`<div class="fake" style="left:${x(s.base)};right:calc(100% - ${x(p.list)})"></div>`:'';
  const realseg=s.cur<s.base?`<div class="realseg" style="left:${x(s.cur)};right:calc(100% - ${x(s.base)})"></div>`:'';
  const showBase=Math.abs(s.base-s.cur)>(hi-lo)*0.06&&Math.abs(s.base-p.list)>(hi-lo)*0.06;
  const showLow=s.atl<s.cur;
  return `<div class="tape" style="--tick:${tick}" aria-label="정가 ${won(p.list)}, 평소 ${won(s.base)}, 현재 ${won(s.cur)}, 최저 ${won(s.atl)}">
    <div class="band"><div class="ticks"></div><div class="ticks major"></div>${fake}${realseg}</div>
    <div class="mk list" style="left:${x(p.list)}"><span>정가 ${n(p.list)}</span><i class="pin"></i></div>
    ${showBase?`<div class="mk base" style="left:${x(s.base)}"><span>평소 ${n(s.base)}</span><i class="pin"></i></div>`:''}
    ${showLow?`<div class="mk low" style="left:${x(s.atl)}"><span>최저 ${n(s.atl)}</span><i class="pin"></i></div>`:''}
    <div class="mk cur" style="left:${x(s.cur)};--from:${x(p.list)}"><span>지금 ${n(s.cur)}</span><i class="pin"></i></div></div>`}
function row(p){const s=p.s;return `<div class="row" onclick="location.hash='#/p/${p.id}'">
  <div class="thumb" style="background:${p.bg}">${p.emoji}</div>
  <div class="who"><div class="b">${p.brand}</div><div class="n">${p.name}</div><div class="meta">${p.platform}, ${s.days}일째 측정</div>${verdict(s)}</div>
  ${tape(p)}
  <div class="price"><div class="cur">${n(s.cur)}원</div><div class="was">${n(p.list)}원</div></div>
  <button class="heart ${wished.has(p.id)?'on':''}" aria-label="찜" onclick="event.stopPropagation();this.classList.toggle('on');this.textContent=this.classList.contains('on')?'♥':'♡'">${wished.has(p.id)?'♥':'♡'}</button></div>`}
function home(){app.innerHTML=`<section class="intro"><div><h1>정가가 아니라 평소 가격으로 잽니다</h1><p>모든 상품을 같은 줄자에 올렸습니다. 빗금은 쇼핑몰이 주장하는 할인, 초록은 평소보다 실제로 내려간 만큼입니다.</p></div>
  <div class="legend"><b>읽는 법</b><br>빨간 핀은 쇼핑몰이 표시한 정가, 회색 핀은 최근 30일 평소 가격, 검은 핀은 지금 가격, 보라 핀은 수집 이후 최저가입니다.</div></section>
  <div class="controls"><div class="seg">${Object.values(CAT).map((c,i)=>`<button class="${i?'':'on'}">${c}</button>`).join('')}</div>
  <label class="chk"><input type="checkbox" checked>무신사</label><label class="chk"><input type="checkbox" checked>29CM</label><label class="chk"><input type="checkbox" checked>브랜드몰</label>
  <label class="chk"><input type="checkbox">부풀림 의심 숨기기</label><span class="sort">정렬: 실제로 내려간 비율</span></div>
  <div class="list">${[...products].sort((a,b)=>b.s.real-a.s.real).map(row).join('')}</div>`}
function detail(id){const p=P(id),s=p.s;app.innerHTML=`<a class="back" href="#/">목록으로</a>
  <section class="dtop"><div class="dthumb" style="background:${p.bg}">${p.emoji}</div><div>
  <div class="sub">${p.platform}에서 판매 중, ${s.since}부터 ${s.days}일 측정</div><h1>${p.brand} ${p.name}</h1>${verdict(s)}
  <div class="three"><div><small>현재 할인가</small><b>${n(s.cur)}원</b></div><div><small>정가</small><b style="color:var(--insuf);text-decoration:line-through">${n(p.list)}원</b></div><div><small>역대 최저가 (${s.atlDate})</small><b style="color:var(--low)">${n(s.atl)}원</b></div></div>
  <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn tape" onclick="document.getElementById('watch').scrollIntoView({behavior:'smooth'})">가격 알림 받기</button><button class="btn line">${wished.has(p.id)?'♥ 찜함':'♡ 찜하기'}</button><button class="btn line">${p.platform}에서 보기</button></div></div></section>
  <section class="bigtape"><h2>이 상품을 줄자로 재면</h2>${tape(p,true)}
  <div class="explain"><div>쇼핑몰이 말하는 할인<b style="color:var(--inflated)">${pct(s.disp)}</b>정가 ${n(p.list)}원 기준</div><div>실제로 내려간 만큼<b style="color:${s.real>=.1?'var(--real)':'var(--ink)'}">${pct(Math.max(0,s.real))}</b>평소 가격 ${n(s.base)}원 기준</div><div>정가로 팔린 날<b>${s.lpDays}일 / ${s.days}일</b>${p.verdict}</div></div></section>
  <div class="cols"><section class="panel"><h2>날짜별 가격</h2>${chart(p,s,{w:700,h:240})}
  ${p.compare?`<h2 style="margin-top:20px">다른 곳 가격</h2><table class="cmp">${p.compare.map(([a,b],i)=>`<tr><td>${a}${i?'':' (가장 쌈)'}</td><td>${n(b)}원</td></tr>`).join('')}</table>`:''}</section>
  <section class="panel" id="watch"><p class="ai"><small>AI 한 줄 요약</small>${p.ai}</p><h2>가격 알림</h2>
  <label for="tgt" style="margin:0;color:var(--ink-2)">이 가격 이하가 되면 알려주세요</label><input class="field" id="tgt" value="${n(s.atl)}">
  <div class="quick"><button>역대 최저가</button><button>지금보다 10% 아래</button><button>평소 가격의 80%</button></div>
  <label><input type="checkbox" checked>목표가 이하로 내려가면</label><label><input type="checkbox" checked>역대 최저가를 새로 찍으면</label>
  <button class="btn" style="width:100%;margin-top:8px">알림 저장</button></section></div>`;scrollTo(0,0)}
function login(){app.innerHTML=`<form class="auth" onsubmit="event.preventDefault();location.hash='#/me'"><h1>로그인</h1><p>찜과 가격 알림은 로그인하면 쓸 수 있어요.</p>
  <input id="em" placeholder="이메일" value="minsu@"><div class="err">이메일 주소를 끝까지 입력해 주세요</div><input id="pw" type="password" placeholder="비밀번호">
  <button class="btn">로그인</button><button type="button" class="btn line">이메일로 회원가입</button></form>`}
function me(){const w=[{pid:2,t:100000},{pid:6,t:55000},{pid:1,t:99000}];app.innerHTML=`<section class="me"><h1>민수님의 줄자</h1>
  <div class="tabs"><a class="on">관심 상품 ${w.length}</a><a>찜 ${wished.size}</a><a>알림 2</a></div>
  <div class="list">${w.map(x=>{const p=P(x.pid),s=p.s,hit=s.cur<=x.t;return `<div class="row" onclick="location.hash='#/p/${p.id}'"><div class="thumb" style="background:${p.bg}">${p.emoji}</div>
  <div class="who"><div class="b">${p.brand}</div><div class="n">${p.name}</div><div class="meta">목표 ${n(x.t)}원</div><span class="verdict ${hit?'v-real':'v-normal'}"><i></i>${hit?'목표 도달, 알림 보냄':'목표까지 '+n(s.cur-x.t)+'원'}</span></div>
  ${tape(p)}<div class="price"><div class="cur">${n(s.cur)}원</div><div class="was">${n(p.list)}원</div></div><button class="heart" aria-label="삭제">✕</button></div>`}).join('')}</div></section>`}
drop.innerHTML='<h3>알림 <a href="#/me">모두 보기</a></h3>'+NOTIS.map(x=>`<a class="ni ${x.unread?'new':''}" href="#/p/${x.pid}"><span>${x.type==='low'?'★':'◎'}</span><div>${x.msg}<small>${x.time}</small></div></a>`).join('');
bell.onclick=e=>{e.stopPropagation();drop.classList.toggle('on')};document.addEventListener('click',()=>drop.classList.remove('on'));
function route(){const h=location.hash;drop.classList.remove('on');h.startsWith('#/p/')?detail(h.slice(4)):h==='#/login'?login():h==='#/me'?me():home()}
addEventListener('hashchange',route);route();
</script>
</body>
</html>
