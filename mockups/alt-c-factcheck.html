<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세일체크 목업 C · 팩트체크</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&display=swap">
<style>
  :root{--bg:#f6f3ec;--surface:#fff;--text:#1a1a1a;--sub:#5c5c5c;--line:#1a1a1a;--soft:#ddd6c8;--accent:#d9480f;--sale:#d9480f;
    --real:#0f9d58;--normal:#6b6b6b;--inflated:#d9480f;--insuf:#9a9a9a;--low:#6741d9;--down:#1c7ed6;
    --c-line:#1a1a1a;--c-list:#d9480f;--c-low:#6741d9;--c-grid:#ece6da;--c-text:#8a8a8a;--c-bg:#fff}
  *{box-sizing:border-box}body{margin:0;font-family:Pretendard,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
  a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
  .serif{font-family:'Noto Serif KR',serif}.num{font-variant-numeric:tabular-nums}
  .mock{background:#1a1a1a;color:#fff;font-size:12px;padding:6px 16px;display:flex;gap:12px;overflow-x:auto;white-space:nowrap}.mock a{opacity:.7}
  .wrap{max-width:1160px;margin:0 auto;padding:0 16px}
  header{border-bottom:3px double var(--line)}
  .top{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);padding:8px 0;border-bottom:1px solid var(--line)}
  .hd{display:flex;align-items:center;gap:16px;padding:14px 0}
  .logo{font-family:'Noto Serif KR';font-weight:900;font-size:30px;letter-spacing:-1px}.logo small{font-family:Pretendard;font-size:12px;font-weight:500;color:var(--sub);margin-left:8px;letter-spacing:0}
  .icons{margin-left:auto;display:flex;gap:10px;align-items:center;position:relative}
  .ib{position:relative;background:none;border:1px solid var(--line);border-radius:2px;width:38px;height:38px;font-size:16px}.badge{position:absolute;top:-6px;right:-6px;background:var(--accent);color:#fff;font-size:10px;min-width:17px;height:17px;line-height:17px;border-radius:9px;font-weight:700}
  .btn{background:var(--text);color:#fff;border:1px solid var(--text);border-radius:2px;padding:10px 16px;font-weight:700}.btn.ghost{background:transparent;color:var(--text)}
  .nav{display:flex;gap:20px;padding:10px 0;font-weight:600;font-size:13px;overflow-x:auto}.nav span{white-space:nowrap;color:var(--sub)}.nav .on{color:var(--text);text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px}
  .hero{display:grid;grid-template-columns:1.3fr 1fr;gap:32px;padding:28px 0;border-bottom:1px solid var(--line)}
  .kicker{color:var(--accent);font-weight:800;font-size:12px;letter-spacing:.1em}
  .hero h1{font-family:'Noto Serif KR';font-size:34px;line-height:1.3;margin:8px 0 12px}.hero p{color:var(--sub);line-height:1.7;margin:0}
  .claim{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);padding:22px;position:relative}
  .claim small{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}.claim .big{font-family:'Noto Serif KR';font-size:48px;font-weight:900}.arrow{font-size:28px}
  .stamp{display:inline-block;border:3px solid currentColor;padding:6px 12px;font-weight:900;font-family:'Noto Serif KR';transform:rotate(-6deg);letter-spacing:.05em;font-size:16px;background:#fff9}
  .hero .stamp{position:absolute;right:16px;top:-18px;font-size:18px}
  .g-real{color:var(--real)}.g-normal{color:var(--normal)}.g-inflated{color:var(--inflated)}.g-insufficient{color:var(--insuf)}
  .sec{display:flex;justify-content:space-between;align-items:baseline;padding:24px 0 12px}.sec h2{font-family:'Noto Serif KR';margin:0;font-size:22px}.sec span{font-size:13px;color:var(--sub)}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}.chip{border:1px solid var(--line);padding:6px 12px;font-size:12px;border-radius:2px;background:transparent}.chip.on{background:var(--text);color:#fff}
  .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;padding-bottom:40px}
  .card{background:var(--surface);border:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column}
  .thumb{aspect-ratio:4/3;display:grid;place-items:center;font-size:64px;position:relative;border-bottom:1px solid var(--line)}
  .thumb .stamp{position:absolute;left:10px;bottom:10px;font-size:12px;padding:4px 8px;border-width:2px}
  .heart{position:absolute;right:8px;top:8px;background:#fffc;border:1px solid var(--line);width:32px;height:32px;border-radius:50%;font-size:16px;line-height:1;padding:0;font-family:system-ui,sans-serif}
  .cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
  .cb .meta{font-size:11px;color:var(--sub)}.cb .nm{font-weight:700;font-size:13px;line-height:1.35}
  .vs{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--soft);margin-top:auto;padding-top:10px;gap:6px}
  .vs small{font-size:10px;color:var(--sub);display:block}.vs b{font-size:18px;font-family:'Noto Serif KR'}.vs .claimv{color:var(--sub);text-decoration:line-through;text-decoration-color:var(--accent)}
  .pr{display:flex;justify-content:space-between;font-size:12px;margin-top:6px}.pr b{font-size:15px}.lowc{color:var(--low)}
  /* 상세 */
  .dtop{display:grid;grid-template-columns:320px 1fr;gap:32px;padding:24px 0;border-bottom:1px solid var(--line)}
  .dimg{aspect-ratio:1;display:grid;place-items:center;font-size:130px;border:1px solid var(--line);position:relative}
  .dimg .stamp{position:absolute;right:-14px;top:18px;font-size:22px}
  .dtop h1{font-family:'Noto Serif KR';font-size:28px;margin:6px 0 16px;line-height:1.35}
  .verdict{font-family:'Noto Serif KR';font-size:20px;line-height:1.55;border-left:4px solid var(--accent);padding-left:14px;margin:0 0 18px}
  .three{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);background:var(--surface)}
  .three div{padding:14px}.three div+div{border-left:1px solid var(--line)}.three small{font-size:12px;color:var(--sub);display:block}.three b{font-size:22px;font-family:'Noto Serif KR'}
  .evid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:24px 0}
  .ev{background:var(--surface);border:1px solid var(--line);padding:16px}.ev .no{font-family:'Noto Serif KR';color:var(--accent);font-weight:900}.ev h4{margin:4px 0 6px}.ev p{margin:0;color:var(--sub);font-size:13px;line-height:1.55}.ev .n{font-size:26px;font-family:'Noto Serif KR';font-weight:900;margin-top:8px}
  .cpanel{background:var(--surface);border:1px solid var(--line);padding:18px}.chart{width:100%;height:auto}
  .two{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;padding-bottom:40px}
  .ai{background:#fff8e6;border:1px solid var(--line);padding:16px;line-height:1.6;margin-bottom:16px}.ai em{font-style:normal;font-weight:800;font-size:12px;letter-spacing:.08em;display:block;margin-bottom:4px}
  .watch input.num{width:100%;border:1px solid var(--line);padding:12px;font-size:18px;font-weight:700;margin:8px 0;background:#fff}.watch label{display:flex;gap:8px;font-size:13px;margin:6px 0}
  .drop{position:absolute;right:0;top:48px;width:360px;background:#fff;border:1px solid var(--line);box-shadow:6px 6px 0 #1a1a1a;display:none;z-index:20;text-align:left}.drop.on{display:block}
  .drop h4{margin:0;padding:12px 14px;border-bottom:1px solid var(--line);font-family:'Noto Serif KR'}.ni{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--soft);font-size:13px}.ni.unread{background:#fff3eb}.ni small{color:var(--sub);display:block;margin-top:3px}
  .login{max-width:400px;margin:50px auto;background:#fff;border:1px solid var(--line);padding:28px;box-shadow:8px 8px 0 #1a1a1a}.login h2{font-family:'Noto Serif KR';margin-top:0}.login input{width:100%;border:1px solid var(--line);padding:12px;margin-top:8px;font:inherit}.login .btn{width:100%;margin-top:12px;padding:12px}
  footer{border-top:3px double var(--line);font-size:12px;color:var(--sub);padding:18px 0 40px}
  @media (max-width:1024px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{grid-template-columns:1fr}.two{grid-template-columns:1fr}}
  @media (max-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.thumb{font-size:44px}.vs b{font-size:15px}.hero h1{font-size:26px}.claim .big{font-size:36px}
    .dtop{grid-template-columns:1fr}.dimg{font-size:90px;max-width:240px}.evid{grid-template-columns:1fr}.three b{font-size:16px}.top span:last-child{display:none}.logo small{display:none}.icons .btn{white-space:nowrap;padding:9px 12px}.hero .stamp{top:-24px;right:8px;font-size:14px}.drop{position:fixed;left:8px;right:8px;width:auto;top:120px}.verdict{font-size:17px}}
</style>
</head>
<body>
<div class="mock"><a href="index.html">← 목업 목록</a><span>대안 C · 팩트체크</span><a href="#/">홈</a><a href="#/p/1">상세(부풀림)</a><a href="#/p/2">상세(진짜)</a><a href="#/login">로그인</a></div>
<header><div class="wrap">
  <div class="top"><span>2026년 11월 29일 (토) · 21:00 수집분</span><span>오늘 32,410개 상품 판정 완료</span></div>
  <div class="hd"><a class="logo" href="#/">세일체크<small>할인율, 진짜인지 확인해 드립니다</small></a>
    <div class="icons"><button class="ib" id="bell" aria-label="알림">🔔<span class="badge">2</span></button><div class="drop" id="drop"></div><button class="ib" aria-label="검색">🔍</button><a class="btn ghost" href="#/login">로그인</a></div></div>
  <div class="nav"><span class="on">오늘의 판정</span><span>진짜 할인</span><span>부풀림 의심</span><span>역대 최저가</span><span>신발</span><span>상의</span><span>하의</span><span>아우터</span></div>
</div></header>
<main id="app" class="wrap"></main>
<footer><div class="wrap">세일체크는 비상업 학습 프로젝트입니다. 판정은 2026-11-14부터 직접 수집한 가격 기록만으로 계산하며, 수집 7일 미만 상품은 판정하지 않습니다.</div></footer>
<script src="shared.js"></script>
<script>
const {products,GRADE,NOTIS,won,pct,chart}=SC;const app=document.getElementById('app');const wished=new Set([2]);
const stamp=(s,extra='')=>{const g=GRADE[s.grade];return `<span class="stamp ${g.cls} ${extra}">${g.sym} ${g.label}</span>`};
const card=p=>{const s=p.s;return `<div class="card" onclick="location.hash='#/p/${p.id}'"><div class="thumb" style="background:${p.bg}">${p.emoji}${stamp(s)}
  <button class="heart" onclick="event.stopPropagation();this.textContent=this.textContent==='♥'?'♡':'♥'">${wished.has(p.id)?'♥':'♡'}</button></div>
  <div class="cb"><div class="meta">${p.platform} · ${p.brand}</div><div class="nm">${p.name}</div>
  <div class="vs"><div><small>쇼핑몰 표시</small><b class="claimv">${pct(s.disp)}</b></div><div><small>실제 할인</small><b class="g-${s.grade}">${s.grade==='insufficient'?'?':pct(Math.max(0,s.real))}</b></div></div>
  <div class="pr"><span><b class="num">${won(s.cur)}</b></span><span class="lowc num">최저 ${won(s.atl)}</span></div></div></div>`};
function home(){const f=products[0],s=f.s;app.innerHTML=`<section class="hero"><div><div class="kicker">오늘의 팩트체크</div>
  <h1>"${pct(s.disp)} 할인" 패딩,<br>정가로 팔린 날은 <u>${s.lpDays}일</u>이었다</h1>
  <p>${f.brand} ${f.name}은 ${s.days}일 동안 매일 ${won(s.cur)}에 팔렸습니다. 쇼핑몰이 표시한 정가 ${won(f.list)}은 실제 판매 기록에 없습니다.</p>
  <p style="margin-top:14px"><a href="#/p/1" style="font-weight:700;text-decoration:underline">근거 자세히 보기 →</a></p></div>
  <div class="claim"><div><small>쇼핑몰 주장</small><span class="big" style="color:var(--sub);text-decoration:line-through;text-decoration-color:var(--accent)">${pct(s.disp)}</span></div><div class="arrow">→</div>
  <div><small>세일체크 확인</small><span class="big g-inflated">${pct(Math.max(0,s.real))}</span></div>${stamp(s)}</div></section>
  <div class="sec"><h2>판정 결과</h2><span>실제 할인율 순</span></div>
  <div class="filters"><span class="chip on">전체 플랫폼</span><span class="chip">무신사</span><span class="chip">29CM</span><span class="chip">브랜드몰</span><span class="chip">★ 역대 최저가만</span><span class="chip">부풀림 의심 숨기기</span></div>
  <div class="grid">${[...products].sort((a,b)=>b.s.real-a.s.real).map(card).join('')}</div>`}
function detail(id){const p=products.find(x=>x.id==id),s=p.s;
  app.innerHTML=`<a href="#/" style="display:inline-block;margin-top:16px;font-size:13px;color:var(--sub)">← 판정 목록</a><section class="dtop">
  <div class="dimg" style="background:${p.bg}">${p.emoji}${stamp(s)}</div>
  <div><div class="kicker">${p.platform} · ${p.brand}</div><h1>${p.name}</h1><p class="verdict">${p.verdict}</p>
  <div class="three"><div><small>현재 할인가</small><b class="num">${won(s.cur)}</b></div><div><small>정가 (쇼핑몰 표시)</small><b class="num" style="color:var(--sub);text-decoration:line-through">${won(p.list)}</b></div><div><small>역대 최저가 · ${s.atlDate}</small><b class="num lowc">${won(s.atl)}</b></div></div>
  <div style="display:flex;gap:8px;margin-top:16px"><button class="btn ghost">${wished.has(p.id)?'♥ 찜함':'♡ 찜'}</button><a class="btn" style="flex:1;text-align:center" href="#watch">🔔 가격 알림 받기</a><button class="btn ghost">${p.platform} ↗</button></div></div></section>
  <section class="evid"><div class="ev"><span class="no">근거 1</span><h4>표시 할인율 vs 실제 할인율</h4><p>정가 대비 vs 최근 30일 중앙값(${won(s.base)}) 대비</p><div class="n"><span style="color:var(--sub);text-decoration:line-through">${pct(s.disp)}</span> → <span class="g-${s.grade}">${pct(Math.max(0,s.real))}</span></div></div>
  <div class="ev"><span class="no">근거 2</span><h4>정가로 팔린 날</h4><p>정가의 98% 이상 가격으로 팔린 날 수</p><div class="n">${s.lpDays} <span style="font-size:15px;color:var(--sub)">/ ${s.days}일</span></div></div>
  <div class="ev"><span class="no">근거 3</span><h4>역대 최저가와 비교</h4><p>${s.since}부터 수집한 기록 중 최저가</p><div class="n">${s.isAtl?'<span class="lowc">★ 최저가</span>':'+'+won(s.cur-s.atl)}</div></div></section>
  <section class="two"><div class="cpanel"><h3 class="serif" style="margin:0 0 8px">가격 기록</h3>${chart(p,s,{w:700,h:250})}<p style="font-size:12px;color:var(--sub);margin:6px 0 0">— 판매가 · <span style="color:var(--accent)">- - 정가</span> · <span class="lowc">● 역대 최저가</span> · ${s.since}부터 ${s.days}일</p>
  ${p.compare?`<h3 class="serif" style="margin:20px 0 6px">플랫폼별 가격</h3>${p.compare.map(([a,b],i)=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--soft)"><span>${a}${i?'':' <b class="g-real">최저</b>'}</span><b class="num">${won(b)}</b></div>`).join('')}`:''}</div>
  <div><div class="ai"><em>AI 한 줄 요약 · 지금 사도 될까?</em>${p.ai}</div>
  <div class="cpanel watch" id="watch"><h3 class="serif" style="margin:0">🔔 이 가격이 되면 알려주세요</h3><input class="num" value="${won(s.atl)}">
  <div class="filters"><span class="chip on">역대 최저가</span><span class="chip">현재가 −10%</span></div>
  <label><input type="checkbox" checked> 목표가 이하로 내려가면</label><label><input type="checkbox" checked> 역대 최저가가 갱신되면</label><button class="btn" style="width:100%;margin-top:8px">관심 상품 저장</button></div></div></section>`;scrollTo(0,0)}
function login(){app.innerHTML=`<div class="login"><h2>로그인</h2><p style="color:var(--sub);font-size:13px">찜과 가격 알림을 쓰려면 로그인하세요</p><input placeholder="이메일"><input type="password" placeholder="비밀번호"><button class="btn">로그인</button><button class="btn ghost">회원가입</button></div>`}
drop.innerHTML='<h4>알림</h4>'+NOTIS.map(x=>`<a class="ni ${x.unread?'unread':''}" href="#/p/${x.pid}"><span>${x.type==='low'?'★':'🎯'}</span><div>${x.msg}<small>${x.time}</small></div></a>`).join('');
bell.onclick=e=>{e.stopPropagation();drop.classList.toggle('on')};document.onclick=()=>drop.classList.remove('on');
function route(){const h=location.hash;drop.classList.remove('on');h.startsWith('#/p/')?detail(h.slice(4)):h==='#/login'?login():home()}
addEventListener('hashchange',route);route();
</script>
</body>
</html>
